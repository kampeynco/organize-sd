<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organize SD | Train. Organize. Win. South Dakota.</title>
    <meta name="description" content="Organize SD trains South Dakotans to build and run grassroots organizing programs: volunteer recruitment, voter contact, and turnout for 2028 and beyond.">
    <meta name="theme-color" content="#311b92">
    <meta property="og:title" content="Organize SD | Train. Organize. Win.">
    <meta property="og:description" content="Hands-on organizer training for South Dakota. Apply for the next weekend intensive.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/brand/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png">
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">

    <!-- Paint the brand color immediately so mobile never flashes white while the app loads -->
    <style>html,body{background:#311b92;margin:0}</style>

    <!-- Icons: loaded without blocking first paint -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
</head>
<body class="text-brand-ink">
    <div id="root"></div>
    <!-- Only "/" matches the prerendered markup; clear it on other routes before it paints -->
    <script>if (location.pathname !== '/') document.getElementById('root').innerHTML = '';</script>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
