<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organize SD | Train. Organize. Win. South Dakota.</title>
    <meta name="description" content="Organize SD trains South Dakota Democrats and progressives to build and run grassroots organizing programs: volunteer recruitment, voter contact, and turnout for 2028 and beyond.">
    <meta name="theme-color" content="#311b92">
    <!-- Social share previews: crawlers don't run JS or resolve relative URLs, so every URL here is absolute -->
    <meta property="og:site_name" content="Organize SD">
    <meta property="og:title" content="Organize SD | Train. Organize. Win.">
    <meta property="og:description" content="Hands-on organizer training for South Dakota Democrats and progressives. Apply for the next weekend intensive.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.organizesd.org/">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="https://www.organizesd.org/brand/og-train-organize-win.jpg">
    <meta property="og:image:secure_url" content="https://www.organizesd.org/brand/og-train-organize-win.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Train. Organize. Win. in bold white type on a purple background.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Organize SD | Train. Organize. Win.">
    <meta name="twitter:description" content="Hands-on organizer training for South Dakota Democrats and progressives. Apply for the next weekend intensive.">
    <meta name="twitter:image" content="https://www.organizesd.org/brand/og-train-organize-win.jpg">
    <meta name="twitter:image:alt" content="Train. Organize. Win. in bold white type on a purple background.">
    <!-- ?v= busts browsers' long-lived favicon cache; bump it whenever the icons change -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png?v=2">
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=2">

    <!-- Paint the brand color immediately so mobile never flashes white while the app loads -->
    <style>html,body{background:#311b92;margin:0}</style>

    <!-- Fetch the navbar logo first so it is ready for the first paint instead of trailing the fonts -->
    <link rel="preload" as="image" href="/brand/logo-320.webp" imagesrcset="/brand/logo-160.webp 160w, /brand/logo-320.webp 320w, /brand/logo-480.webp 480w, /brand/logo-640.webp 640w" imagesizes="(min-width: 768px) 124px, 96px" fetchpriority="high">
</head>
<body class="text-brand-ink">
    <div id="root"></div>
    <!-- Only "/" matches the prerendered markup; clear it on other routes before it paints -->
    <script>if (location.pathname !== '/') document.getElementById('root').innerHTML = '';</script>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
